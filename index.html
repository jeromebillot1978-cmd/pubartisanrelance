<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Artisan Relance — la pub en 15 secondes</title>
<meta name="description" content="Vous faites les devis, Artisan Relance s'occupe des relances. Découvrez la plateforme : artisan-relance.jercat.fr">
<meta property="og:title" content="Artisan Relance — la pub en 15 secondes">
<meta property="og:description" content="Relances automatiques de devis pour les artisans du bâtiment, à votre nom.">
<meta property="og:type" content="video.other">
<meta property="og:url" content="https://pubartisanrelance.vercel.app/">
<meta property="og:image" content="https://pubartisanrelance.vercel.app/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Artisan Relance : vos devis relancés automatiquement, à votre nom. Vidéo de 15 secondes.">
<meta property="og:video" content="https://pubartisanrelance.vercel.app/pub-artisan-relance-15s.mp4">
<meta property="og:video:type" content="video/mp4">

<meta property="og:video:height" content="1920">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://pubartisanrelance.vercel.app/og-image.jpg">
<meta name="theme-color" content="#0B1530">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#09090B;color:#F8FAFC;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px}
  .cadre{position:relative;height:min(84vh,calc((100vw - 32px)*16/9));aspect-ratio:9/16;border-radius:22px;overflow:hidden;box-shadow:0 0 60px rgba(47,123,255,.35)}
  video{width:100%;height:100%;display:block;object-fit:cover;background:#0B1530}
  #son{position:absolute;top:12px;right:12px;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.55);color:#fff;font:700 15px inherit;font-family:inherit;cursor:pointer}
  .cta{display:inline-block;padding:14px 26px;border-radius:999px;background:#E85D04;color:#fff;font-weight:700;text-decoration:none;box-shadow:0 0 30px rgba(232,93,4,.5)}
  .liens{font-size:14px;opacity:.7}
  .liens a{color:#8DB8FF}
</style>
</head>
<body>
<main>
  <div class="cadre">
    <!-- autoplay + muted + playsinline : la vidéo démarre seule sur tous les navigateurs -->
    <video id="pub" src="/pub-artisan-relance-15s.mp4" poster="/apercu.jpg" autoplay muted loop playsinline preload="auto"></video>
    <button id="son" type="button">🔊 Activer le son</button>
  </div>
  <a class="cta" href="https://artisan-relance.jercat.fr/">Découvrir la plateforme</a>
  <div class="liens"><a href="/pub-artisan-relance">Version animée (HTML)</a> · <a href="/pub-artisan-relance-15s.mp4" download>Télécharger le MP4</a></div>
</main>
<script>
  const v = document.getElementById("pub"), b = document.getElementById("son");
  v.play().catch(() => {});
  b.onclick = () => {
    v.muted = !v.muted;
    if (!v.muted) { v.currentTime = 0; v.play(); }
    b.textContent = v.muted ? "🔊 Activer le son" : "🔇 Couper le son";
  };
</script>
</body>
</html>
