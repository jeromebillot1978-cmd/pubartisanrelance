<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pub Artisan Relance — 15 s — 9:16</title>
<!-- Polices : Montserrat (titres) et Inter (textes). Chargées depuis Google Fonts si besoin. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Inter:wght@500;600;700&display=swap">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui,sans-serif}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;display:block;background:#0B1530}
  #play{position:absolute;top:16px;right:16px;padding:12px 18px;border-radius:999px;background:rgba(0,0,0,.6);color:#fff;font:700 16px Inter,sans-serif;cursor:pointer;border:1px solid rgba(255,255,255,.3);display:none}
  #help{position:absolute;left:12px;bottom:10px;color:#fff;opacity:.55;font:13px Inter,sans-serif}
  body.render #play, body.render #help{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>
<button id="play">🔊 Activer le son</button>
<div id="help">Démarrage automatique · Espace : pause / lecture · ← → : image par image · R : rejouer</div>
<audio id="music" src="bande-son.m4a" preload="auto"></audio>
<script>
/* =====================================================================
   PUB ARTISAN RELANCE — 15 s — 1080 x 1920 — 30 i/s
   Une seule fonction dessine n'importe quel instant : renderFrame(t)
   - Dans le navigateur : la pub se joue en boucle (avec le son si
     bande-son.m4a est dans le même dossier).
   - Pour l'export vidéo : render.js appelle renderFrame(t) image par image.
   ---------------------------------------------------------------------
   RÉGLAGES FACILES
   ===================================================================== */
const CONFIG = {
  // Vraie capture de votre tableau de bord (scène 4). Mettez par ex.
  // "capture.png" (portrait, sans chiffres visibles). Laissez "" pour
  // l'interface schématique sans aucun chiffre.
  capture: "",
  textes: {
    s1: "Artisan ?",
    s2a: "Devis envoyé…",
    s2b: [[["…et ", "w"], ["personne", "o"]], [["ne relance", "o"], [" ?", "w"]]],
    s3: ["Relances", "automatiques", "à votre nom"],
    s3stop: "Stop dès que le client répond",
    s4: ["Une plateforme pensée", "pour les artisans"],
    s5a: "Rejoignez",
    s5b: ["Artisan", "Relance"],
    bouton: "Découvrir la plateforme",
    lien: "artisan-relance.jercat.fr",
    mention: "Gratuit · Sans carte bancaire" // à retirer si ce n'est plus vrai
  }
};

const W = 1080, H = 1920, FPS = 30, DUR = 15;
const COL = { navy:"#0B1530", deep:"#09090B", blue:"#2F7BFF", blueL:"#8DB8FF",
              orange:"#FF8A2B", btn:"#E85D04", white:"#F8FAFC" };
const TITLE = '"Montserrat", sans-serif', BODY = '"Inter", sans-serif';

const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

/* ---------- outils mathématiques ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const P = (t, a, b) => clamp((t - a) / (b - a));
const E = {
  out: k => 1 - Math.pow(1 - k, 3),
  in: k => k * k * k,
  inOut: k => k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2,
  back: k => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(k - 1, 3) + c1 * Math.pow(k - 1, 2); },
  expo: k => k >= 1 ? 1 : 1 - Math.pow(2, -10 * k)
};
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function mk(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }

/* ---------- textes ---------- */
function setFont(c, weight, size, fam) { c.font = `${weight} ${size}px ${fam}`; }
function fit(text, weight, fam, size, maxW) {
  setFont(ctx, weight, size, fam);
  const w = ctx.measureText(text).width;
  return w > maxW ? Math.floor(size * maxW / w) : size;
}
// segments : [[texte, "w"|"o"], ...] centrés sur x
function drawSegs(c, segs, x, y, size, weight, fam, alpha = 1) {
  setFont(c, weight, size, fam);
  c.textBaseline = "middle"; c.textAlign = "left";
  let total = 0; for (const [s] of segs) total += c.measureText(s).width;
  let cx = x - total / 2;
  c.save(); c.globalAlpha *= alpha;
  c.shadowColor = "rgba(0,0,0,.45)"; c.shadowBlur = 14; c.shadowOffsetY = 4;
  for (const [s, k] of segs) {
    c.fillStyle = k === "o" ? COL.orange : COL.white;
    c.fillText(s, cx, y); cx += c.measureText(s).width;
  }
  c.restore();
  return total;
}
// entrée standard d'un texte : fondu + léger zoom + montée
function enter(t, start, d = .28) {
  const k = E.out(P(t, start, start + d));
  return { a: P(t, start, start + d * .7), s: lerp(1.18, 1, k), dy: lerp(26, 0, k) };
}
function textIn(t, start, segs, x, y, size, weight, fam) {
  const e = enter(t, start); if (e.a <= 0) return;
  ctx.save(); ctx.translate(x, y + e.dy); ctx.scale(e.s, e.s);
  drawSegs(ctx, segs, 0, 0, size, weight, fam, e.a);
  ctx.restore();
}
function halo(x, y, rx, ry, color, a) {
  ctx.save(); ctx.translate(x, y); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, color.replace("A", a)); g.addColorStop(1, color.replace("A", 0));
  ctx.fillStyle = g; ctx.fillRect(-rx, -rx, rx * 2, rx * 2); ctx.restore();
}

/* ---------- fond, particules, grain, vignette ---------- */
const PARTS = (() => { const r = rng(7); return Array.from({ length: 80 }, () => ({ x: r() * W, y: r() * H, rad: .8 + r() * 2.6, sp: 12 + r() * 40, ph: r() * 6.28, a: .15 + r() * .45 })); })();
const GRAIN = (() => { const r = rng(11); return Array.from({ length: 6 }, () => { const c = mk(360, 640), g = c.getContext("2d"), d = g.createImageData(360, 640); for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); return c; }); })();

function background(t, blueGlow = .32) {
  ctx.fillStyle = COL.navy; ctx.fillRect(0, 0, W, H);
  halo(W / 2, H * .46, 900, 1100, "rgba(47,123,255,A)", blueGlow);
  halo(W * 1.02, H * .97, 900, 700, "rgba(255,138,43,A)", .18);
  halo(-60, H * .05, 600, 500, "rgba(47,123,255,A)", .12);
  particles(t);
}
function particles(t) {
  ctx.save();
  for (const p of PARTS) {
    const y = ((p.y - t * p.sp) % H + H) % H, x = p.x + Math.sin(t * .8 + p.ph) * 18;
    ctx.globalAlpha = p.a * (.6 + .4 * Math.sin(t * 2 + p.ph));
    ctx.fillStyle = COL.blueL; ctx.beginPath(); ctx.arc(x, y, p.rad, 0, 6.283); ctx.fill();
  }
  ctx.restore();
}
function post(t) {
  const g = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .72);
  g.addColorStop(0, "rgba(9,9,11,0)"); g.addColorStop(1, "rgba(9,9,11,.72)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = .045; ctx.globalCompositeOperation = "overlay";
  ctx.drawImage(GRAIN[Math.floor(t * FPS) % GRAIN.length], 0, 0, W, H); ctx.restore();
}

/* ---------- les 4 outils (dessinés une fois) ---------- */
function steel(g, x0, y0, x1, y1) { const s = g.createLinearGradient(x0, y0, x1, y1); s.addColorStop(0, "#f2f6fb"); s.addColorStop(.45, "#a9b6c8"); s.addColorStop(1, "#56627a"); return s; }
function wood(g, x0, x1) { const s = g.createLinearGradient(x0, 0, x1, 0); s.addColorStop(0, "#7a4a20"); s.addColorStop(.5, "#c98d4b"); s.addColorStop(1, "#6e421c"); return s; }

const TOOLS = (() => {
  const S = 400;
  // Marteau
  const ham = mk(S, S), h = ham.getContext("2d");
  h.fillStyle = wood(h, 182, 218); rr(h, 182, 130, 36, 230, 14); h.fill();
  h.fillStyle = "#1f2737"; rr(h, 178, 270, 44, 100, 18); h.fill();
  h.fillStyle = steel(h, 0, 70, 0, 160); rr(h, 92, 70, 52, 86, 10); h.fill();
  rr(h, 130, 82, 150, 62, 8); h.fill();
  h.beginPath(); h.moveTo(270, 84); h.quadraticCurveTo(338, 88, 352, 156); h.lineTo(330, 158); h.quadraticCurveTo(316, 120, 270, 142); h.closePath(); h.fill();
  h.strokeStyle = "rgba(255,255,255,.75)"; h.lineWidth = 4; h.beginPath(); h.moveTo(98, 76); h.lineTo(276, 88); h.stroke();
  // Clé à molette / clé plate
  const wr = mk(S, S), w = wr.getContext("2d");
  w.fillStyle = steel(w, 0, 175, 0, 225); rr(w, 120, 180, 190, 40, 20); w.fill();
  w.beginPath(); w.arc(98, 200, 64, 0, 6.283); w.fill();
  w.beginPath(); w.arc(318, 200, 46, 0, 6.283); w.fill();
  w.globalCompositeOperation = "destination-out";
  w.fillRect(20, 178, 72, 44); w.beginPath(); w.arc(318, 200, 24, 0, 6.283); w.fill();
  w.globalCompositeOperation = "source-over";
  w.strokeStyle = "rgba(255,255,255,.7)"; w.lineWidth = 3; w.beginPath(); w.moveTo(130, 186); w.lineTo(300, 186); w.stroke();
  // Casque
  const he = mk(S, S), c = he.getContext("2d");
  const wg = c.createLinearGradient(0, 90, 0, 270); wg.addColorStop(0, "#ffffff"); wg.addColorStop(1, "#b9c4d4");
  c.fillStyle = wg; c.beginPath(); c.ellipse(200, 250, 138, 150, 0, Math.PI, 0); c.fill();
  c.beginPath(); c.ellipse(200, 252, 176, 30, 0, 0, 6.283); c.fill();
  c.fillStyle = "#e9eef5"; rr(c, 184, 104, 32, 146, 14); c.fill();
  c.strokeStyle = "rgba(80,95,120,.35)"; c.lineWidth = 3; rr(c, 184, 104, 32, 146, 14); c.stroke();
  c.fillStyle = COL.orange; rr(c, 72, 228, 256, 12, 6); c.fill();
  c.strokeStyle = "rgba(255,255,255,.9)"; c.lineWidth = 5; c.beginPath(); c.ellipse(200, 250, 118, 130, 0, Math.PI * 1.15, Math.PI * 1.38); c.stroke();
  // Pinceau
  const br = mk(S, S), b = br.getContext("2d");
  b.fillStyle = wood(b, 176, 224); b.beginPath(); b.moveTo(178, 212); b.lineTo(222, 212); b.lineTo(214, 372); b.quadraticCurveTo(200, 388, 186, 372); b.closePath(); b.fill();
  b.fillStyle = steel(b, 150, 0, 250, 0); rr(b, 152, 158, 96, 60, 8); b.fill();
  const bg = b.createLinearGradient(0, 36, 0, 165); bg.addColorStop(0, COL.orange); bg.addColorStop(.42, "#f08a3a"); bg.addColorStop(.5, "#e4cfa6"); bg.addColorStop(1, "#cdb68a");
  b.fillStyle = bg; b.beginPath(); b.moveTo(156, 162); b.lineTo(160, 60); b.quadraticCurveTo(200, 26, 240, 60); b.lineTo(244, 162); b.closePath(); b.fill();
  b.strokeStyle = "rgba(90,60,30,.25)"; b.lineWidth = 2; for (let i = 0; i < 8; i++) { b.beginPath(); b.moveTo(168 + i * 9.5, 160); b.lineTo(170 + i * 8.5, 64); b.stroke(); }
  return { ham, wr, he, br };
})();
const TMP = mk(400, 400), TMPC = TMP.getContext("2d");
function drawTool(img, x, y, rot, sc, a, t, ph) {
  // reflet orange qui glisse sur le métal
  TMPC.clearRect(0, 0, 400, 400); TMPC.globalCompositeOperation = "source-over"; TMPC.drawImage(img, 0, 0);
  TMPC.globalCompositeOperation = "source-atop";
  const p = ((t * .55 + ph) % 1.4) * 600 - 150;
  const g = TMPC.createLinearGradient(p - 90, 0, p + 90, 120);
  g.addColorStop(0, "rgba(255,138,43,0)"); g.addColorStop(.5, "rgba(255,160,80,.55)"); g.addColorStop(1, "rgba(255,138,43,0)");
  TMPC.fillStyle = g; TMPC.fillRect(0, 0, 400, 400);
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sc, sc); ctx.globalAlpha = a;
  ctx.shadowColor = "rgba(47,123,255,.85)"; ctx.shadowBlur = 40;
  ctx.drawImage(TMP, -200, -200);
  ctx.restore();
}

/* ===================== SCÈNE 1 : 0 – 3 s ===================== */
function scene1(t) {
  background(t);
  const cx = W / 2, cy = 900;
  // caméra : zoom lent puis plongée dans le « ? »
  const z1 = 1 + .15 * E.inOut(P(t, 1.0, 2.6));
  const z2 = lerp(1, 7, E.in(P(t, 2.55, 3.0)));
  const size = fit(CONFIG.textes.s1, 900, TITLE, 190, 900);
  setFont(ctx, 900, size, TITLE);
  const full = ctx.measureText(CONFIG.textes.s1).width, qW = ctx.measureText("?").width;
  const qx = cx + full / 2 - qW / 2, qy = cy;
  ctx.save();
  ctx.translate(qx, qy); ctx.scale(z1 * z2, z1 * z2); ctx.translate(-qx, -qy);
  halo(cx, cy, 520, 260, "rgba(255,138,43,A)", .28 * P(t, .3, .8));
  // outils
  const tools = [
    [TOOLS.ham, -2.35, -.25, .35], [TOOLS.wr, -.79, -.05, -.6],
    [TOOLS.he, 2.35, .15, .1], [TOOLS.br, .79, .35, .5]];
  tools.forEach(([img, ang, st, rot0], i) => {
    const k = P(t, st, st + .55), ke = E.back(k);
    const orbit = ang + t * .22;
    const fx = cx + Math.cos(orbit) * 360, fy = cy + Math.sin(orbit) * 470;
    const sx = cx + Math.cos(ang) * 1400, sy = cy + Math.sin(ang) * 1400;
    const x = lerp(sx, fx, ke), y = lerp(sy, fy, ke);
    const rot = rot0 + Math.sin(t * 1.3 + i) * .12 + (1 - ke) * 1.4;
    if (k > 0 && k < .8) for (let g = 1; g <= 3; g++) { // flou de mouvement
      const kg = E.back(clamp(k - g * .05));
      drawTool(img, lerp(sx, fx, kg), lerp(sy, fy, kg), rot, .78, .18, t, i * .3);
    }
    if (k > 0) drawTool(img, x, y, rot, .78, 1, t, i * .3);
  });
  // texte « Artisan ? »
  if (t >= .3) {
    const k = E.out(P(t, .3, .57));
    const s = lerp(1.4, 1, k);
    const shake = (t > .57 && t < .64) ? (Math.sin(t * 400) * 7) : 0;
    ctx.save(); ctx.translate(cx + shake, cy); ctx.scale(s, s);
    const segs = [[CONFIG.textes.s1.replace("?", ""), "w"], ["?", "o"]];
    drawSegs(ctx, segs, 0, 0, size, 900, TITLE, P(t, .3, .45));
    ctx.restore();
  }
  ctx.restore();
  // passage à l'orange (on « entre » dans le ?)
  const o = E.in(P(t, 2.78, 3.0));
  if (o > 0) { ctx.fillStyle = `rgba(255,138,43,${o})`; ctx.fillRect(0, 0, W, H); }
}

/* ===================== SCÈNE 2 : 3 – 6 s ===================== */
function envelope(x, y, w, h, flap) {
  ctx.fillStyle = COL.white; rr(ctx, x - w / 2, y - h / 2, w, h, 16); ctx.fill();
  ctx.strokeStyle = `rgba(47,123,255,${.6 * flap})`; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(x - w / 2 + 10, y - h / 2 + 10); ctx.lineTo(x, y + h * .08); ctx.lineTo(x + w / 2 - 10, y - h / 2 + 10); ctx.stroke();
}
function scene2(t) {
  background(t, .26);
  const cx = W / 2;
  // le devis : feuille -> enveloppe -> s'envole
  const app = E.back(P(t, 3.0, 3.25)), fold = E.inOut(P(t, 3.18, 3.42)), fly = E.in(P(t, 3.42, 3.8));
  if (fly < 1) {
    const dw = lerp(440, 470, fold), dh = lerp(560, 300, fold);
    const y = lerp(1060, -260, fly), s = lerp(.85, 1, app) * lerp(1, .45, fly);
    if (fly > 0) { // traînée orange
      const g = ctx.createLinearGradient(0, y, 0, y + 700 * fly + 100);
      g.addColorStop(0, "rgba(255,138,43,.85)"); g.addColorStop(1, "rgba(255,138,43,0)");
      ctx.fillStyle = g; rr(ctx, cx - 70 * s, y, 140 * s, 700 * fly + 100, 70 * s); ctx.fill();
    }
    ctx.save(); ctx.translate(cx, y); ctx.scale(s, s); ctx.globalAlpha = P(t, 3.0, 3.12);
    ctx.shadowColor = "rgba(47,123,255,.6)"; ctx.shadowBlur = 50;
    if (fold < .5) {
      ctx.fillStyle = COL.white; rr(ctx, -dw / 2, -dh / 2, dw, dh, 18); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = `rgba(120,135,160,${.55 * (1 - fold * 2)})`;
      rr(ctx, -dw / 2 + 40, -dh / 2 + 50, 170, 22, 11); ctx.fill();
      for (let i = 0; i < 7; i++) { rr(ctx, -dw / 2 + 40, -dh / 2 + 120 + i * 50, dw - 80 - (i % 3) * 60, 14, 7); ctx.fill(); }
      ctx.fillStyle = `rgba(47,123,255,${.35 * (1 - fold * 2)})`; rr(ctx, dw / 2 - 170, dh / 2 - 80, 130, 30, 10); ctx.fill();
    } else { ctx.shadowBlur = 40; envelope(0, 0, dw, dh, (fold - .5) * 2); }
    ctx.restore();
  }
  // calendrier qui défile : J+1, J+2, …
  const cal = E.back(P(t, 3.75, 4.05));
  if (cal > 0) {
    const steps = 5, k = P(t, 3.9, 5.4) * steps, n = Math.min(steps, Math.floor(k) + 1), fr = k - Math.floor(k);
    ctx.save(); ctx.translate(cx, 1000); ctx.scale(cal, cal);
    ctx.shadowColor = "rgba(47,123,255,.5)"; ctx.shadowBlur = 50;
    ctx.fillStyle = "#121c38"; rr(ctx, -210, -210, 420, 400, 36); ctx.fill(); ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(141,184,255,.35)"; ctx.lineWidth = 3; rr(ctx, -210, -210, 420, 400, 36); ctx.stroke();
    ctx.fillStyle = COL.blue; rr(ctx, -210, -210, 420, 92, [36, 36, 0, 0]); ctx.fill();
    ctx.fillStyle = "#c9d6ee"; for (const dx of [-110, 110]) { rr(ctx, dx - 10, -238, 20, 56, 10); ctx.fill(); }
    const flip = k < steps && fr < .22 && n > 1 ? E.out(fr / .22) : 1;
    ctx.save(); ctx.translate(0, 40); ctx.scale(1, flip);
    setFont(ctx, 900, 150, TITLE); ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = COL.white; ctx.fillText("J+" + n, 0, 0); ctx.restore();
    ctx.restore();
    // boîte de réception vide
    const ib = E.out(P(t, 4.2, 4.5));
    if (ib > 0) {
      ctx.save(); ctx.translate(cx, 1325); ctx.scale(ib, ib); ctx.globalAlpha = ib;
      ctx.strokeStyle = "rgba(141,184,255,.85)"; ctx.lineWidth = 7; ctx.lineJoin = "round";
      ctx.beginPath(); ctx.moveTo(-80, -10); ctx.lineTo(-55, -55); ctx.lineTo(55, -55); ctx.lineTo(80, -10); ctx.lineTo(80, 45); ctx.lineTo(-80, 45); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-80, -10); ctx.lineTo(-30, -10); ctx.lineTo(-20, 12); ctx.lineTo(20, 12); ctx.lineTo(30, -10); ctx.lineTo(80, -10); ctx.stroke();
      const pr = ((t - 4.2) % .9) / .9;
      ctx.globalAlpha = ib * (1 - pr) * .5; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, 110 + pr * 60, 0, 6.283); ctx.stroke();
      ctx.restore();
    }
  }
  // assombrissement : l'attente
  const dim = .32 * E.inOut(P(t, 4.0, 5.2));
  ctx.fillStyle = `rgba(9,9,11,${dim})`; ctx.fillRect(0, 0, W, H);
  // texte 1 : effet machine à écrire
  const s2a = CONFIG.textes.s2a, sz1 = fit(s2a, 800, TITLE, 96, 900);
  const nch = Math.round(P(t, 3.3, 3.7) * s2a.length);
  if (nch > 0) {
    const shown = s2a.slice(0, nch);
    setFont(ctx, 800, sz1, TITLE); const fullW = ctx.measureText(s2a).width;
    ctx.save(); ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 14; ctx.fillStyle = COL.white;
    ctx.fillText(shown, cx - fullW / 2, 380);
    if (nch < s2a.length || Math.floor(t * 4) % 2 === 0 && t < 4.4) { const cw = ctx.measureText(shown).width; ctx.fillStyle = COL.orange; ctx.fillRect(cx - fullW / 2 + cw + 6, 380 - sz1 * .42, 8, sz1 * .84); }
    ctx.restore();
  }
  // texte 2
  const lines = CONFIG.textes.s2b;
  const sz2 = Math.min(...lines.map(l => fit(l.map(s => s[0]).join(""), 800, TITLE, 96, 900)));
  textIn(t, 4.4, lines[0], cx, 520, sz2, 800, TITLE);
  textIn(t, 4.52, lines[1], cx, 520 + sz2 * 1.12, sz2, 800, TITLE);
}

/* ===================== SCÈNE 3 : 6 – 9 s ===================== */
const CARD = { w: 760, h: 160 };
function mailIcon(x, y, r) {
  ctx.fillStyle = COL.blue; ctx.beginPath(); ctx.arc(x, y, r, 0, 6.283); ctx.fill();
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 4; ctx.lineJoin = "round";
  rr(ctx, x - r * .5, y - r * .34, r, r * .68, 4); ctx.stroke();

    }
    requestAnimationFrame(loop);
  })();
}
</script>
